# /etc/nginx/sites-available/app  (then: ln -s ../sites-available/app /etc/nginx/sites-enabled/)
# After DNS points to the server: sudo certbot --nginx -d example.com -d www.example.com
server {
    listen 80;
    server_name example.com www.example.com;   # TODO: buyer's domain
    client_max_body_size 20m;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
